# The launcher's installers and its update feed (fork). A tag launcher-v<version> (the version in
# launcher/src-tauri/tauri.conf.json) builds the macOS .dmg (Apple silicon) and the Windows setup .exe, signs the update
# packages with the TAURI_SIGNING_PRIVATE_KEY secret and publishes them in a release with latest.json, which the
# installed launchers read (plugins.updater in tauri.conf.json).
name: Launcher release

on:
  push:
    tags: ['launcher-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri -> target

      - run: npm ci
        working-directory: launcher

      # the release's text: launcher/release-notes/<version>.md (launcher/release.py writes it), else a plain line
      - id: notes
        shell: bash
        run: |
          f="launcher/release-notes/${GITHUB_REF_NAME#launcher-v}.md"
          {
            echo 'body<<NOTES_EOF'
            if [ -f "$f" ]; then cat "$f"; else echo 'Instaladores do UltraTears Launcher. / UltraTears Launcher installers.'; fi
            echo
            echo 'Windows: `_x64-setup.exe` · macOS (Apple silicon): `.dmg` · Launchers já instalados se atualizam sozinhos. / Installed launchers update themselves.'
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: launcher
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: UltraTears Launcher ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
